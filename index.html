<!doctype html>
<html>
<head>
<meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style><title>旅先ルーレット</title>
</head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Antique+B1&family=Shippori+Mincho:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#efe6d0;
    --paper-deep:#e6dabb;
    --paper-line: #d9c99e;
    --ink:#221f1a;
    --ink-soft:#5c5644;
    --ink-faint:#8a8262;
    --aka:#bd3b28;
    --aka-deep:#9c2e1f;
    --sumi:#28241f;
    --ai:#2e4a6b;
    --ai-deep:#233a56;
    --gold:#b8863b;
    --gray-area:#6f6a5a;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:
      radial-gradient(circle at 1px 1px, rgba(34,31,26,0.05) 1px, transparent 0) 0 0/14px 14px,
      var(--paper);
    color:var(--ink);
    font-family:"Shippori Mincho", "Zen Kaku Gothic New", serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }

  ::selection{ background: var(--aka); color: var(--paper); }

  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:2rem 1.4rem 3rem;
  }

  /* ---------- header ---------- */
  header{ text-align:center; margin-bottom:1.4rem; }

  .eyebrow{
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-size:.72rem;
    letter-spacing:.32em;
    color:var(--aka-deep);
    font-weight:700;
    margin:0 0 .7rem;
  }

  h1{
    font-family:"Shippori Antique B1", "Zen Kaku Gothic New", sans-serif;
    font-size:clamp(2.1rem, 6vw, 3rem);
    margin:0 0 .6rem;
    letter-spacing:.03em;
    text-wrap:balance;
  }

  .lede{
    max-width:34em;
    margin:0 auto;
    color:var(--ink-soft);
    font-size:.98rem;
  }

  .legend{
    display:flex;
    justify-content:center;
    gap:1.4rem;
    flex-wrap:wrap;
    margin-top:1rem;
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-size:.76rem;
    color:var(--ink-soft);
  }
  .legend span{ display:inline-flex; align-items:center; gap:.4rem; }
  .legend i{ width:.6rem; height:.6rem; border-radius:50%; display:inline-block; }
  .legend .c1{ background:var(--aka); }
  .legend .c2{ background:var(--sumi); }
  .legend .c3{ background:var(--ai); }

  /* ---------- map ---------- */
  .map-stage{
    position:relative;
    background:var(--paper-deep);
    border:1px solid var(--paper-line);
    border-radius:6px;
    padding:.9rem;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 26px -18px rgba(34,31,26,.6);
    margin-bottom:1rem;
  }
  .map-box{
    aspect-ratio: 5 / 6;
    max-height:54vh;
    margin:0 auto;
    overflow:hidden;
  }
  #japanMap{ width:100%; height:100%; display:block; }
  #japanMap .muni{ stroke:#1a1a1a; stroke-width:0.6; stroke-opacity:.4; fill-rule:evenodd; transition: fill .6s ease; }

  .pin-ring{ fill:none; stroke:var(--aka-deep); stroke-width:2.4; opacity:.7; transform-box:fill-box; transform-origin:center; animation: pin-pulse 1.6s ease-out infinite; }
  .pin-dot{ fill:var(--aka-deep); stroke:var(--paper); stroke-width:1.5; }
  @keyframes pin-pulse{
    0%{ transform:scale(.6); opacity:.8; }
    100%{ transform:scale(2.4); opacity:0; }
  }

  .map-label{
    font-family:"Shippori Antique B1", "Zen Kaku Gothic New", sans-serif;
    font-weight:700;
    text-anchor:middle;
    dominant-baseline:central;
    paint-order:stroke;
    stroke:var(--paper);
    stroke-opacity:.5;
    stroke-linejoin:round;
    pointer-events:none;
    user-select:none;
  }

  .map-caption{
    margin-top:.55rem;
    text-align:center;
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-size:.8rem;
    letter-spacing:.06em;
    color:var(--ink-soft);
    min-height:1.4em;
  }
  .map-munis{
    margin:.5rem auto 0;
    max-width:46em;
    text-align:center;
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-size:.74rem;
    line-height:1.95;
    letter-spacing:.03em;
    color:var(--ink-soft);
  }
  .map-munis:empty{ display:none; }
  .map-munis .munis-label{
    display:inline-block;
    margin-right:.6em;
    font-size:.68rem;
    font-weight:700;
    letter-spacing:.16em;
    color:var(--ink-faint);
  }
  .map-munis b{ color:var(--ai); font-weight:700; }

  .map-caption b{ color:var(--ink); font-weight:700; }

  /* ---------- tray ---------- */
  .tray{
    position:relative;
    background:
      repeating-linear-gradient(90deg, rgba(34,31,26,.05) 0 2px, transparent 2px 26px),
      var(--paper-deep);
    border:1px solid var(--paper-line);
    border-radius:6px;
    padding:1.6rem 1.4rem 1.5rem;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 26px -18px rgba(34,31,26,.6);
  }

  .dice-row{
    display:flex;
    justify-content:center;
    gap:clamp(1.4rem, 6vw, 3.2rem);
  }

  .die-slot{ text-align:center; opacity:.4; transition: opacity .3s ease; }
  .die-slot.is-active{ opacity:1; }
  .die-slot.is-done{ opacity:.75; }

  .die-label{
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-size:.68rem;
    letter-spacing:.14em;
    color:var(--ink-faint);
    margin-top:.6rem;
  }
  .die-label b{ display:block; font-size:.86rem; color:var(--ink); margin-top:.1rem; font-weight:700; }

  .perspective{ position:relative; }
  .perspective::after{
    content:"";
    position:absolute; inset:-8px;
    border-radius:50%;
    border:1.5px dashed var(--gold);
    opacity:0;
    transition: opacity .3s ease;
  }
  .die-slot.is-active .perspective::after{ opacity:.9; animation: ring-pulse 1.4s ease-in-out infinite; }
  @keyframes ring-pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.08); }
  }

  .perspective{
    width:64px; height:64px;
    perspective: 420px;
    margin:0 auto;
  }
  @media (min-width:520px){ .perspective{ width:76px; height:76px; } }

  .cube{
    position:relative;
    width:100%; height:100%;
    transform-style:preserve-3d;
    transform: rotateX(0deg) rotateY(0deg);
    transition: transform 1s cubic-bezier(.34,1.56,.64,1);
  }

  .face{
    position:absolute;
    inset:0;
    border-radius:9px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    padding:14%;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), inset 0 -6px 10px rgba(0,0,0,.18);
  }

  .die-slot[data-die="1"] .face{ background:var(--aka); }
  .die-slot[data-die="2"] .face{ background:var(--sumi); }
  .die-slot[data-die="3"] .face{ background:var(--ai); }

  .dot{ width:100%; aspect-ratio:1; border-radius:50%; background:var(--paper); align-self:center; justify-self:center; }
  .tl{ grid-column:1; grid-row:1; } .tr{ grid-column:3; grid-row:1; }
  .ml{ grid-column:1; grid-row:2; } .c { grid-column:2; grid-row:2; } .mr{ grid-column:3; grid-row:2; }
  .bl{ grid-column:1; grid-row:3; } .br{ grid-column:3; grid-row:3; }

  .f1{ transform: translateZ(32px); }
  .f6{ transform: rotateY(180deg) translateZ(32px); }
  .f3{ transform: rotateY(90deg) translateZ(32px); }
  .f4{ transform: rotateY(-90deg) translateZ(32px); }
  .f2{ transform: rotateX(90deg) translateZ(32px); }
  .f5{ transform: rotateX(-90deg) translateZ(32px); }
  @media (min-width:520px){
    .f1{ transform: translateZ(38px); } .f6{ transform: rotateY(180deg) translateZ(38px); }
    .f3{ transform: rotateY(90deg) translateZ(38px); } .f4{ transform: rotateY(-90deg) translateZ(38px); }
    .f2{ transform: rotateX(90deg) translateZ(38px); } .f5{ transform: rotateX(-90deg) translateZ(38px); }
  }

  .roll-stage{ display:flex; justify-content:center; margin-top:1.4rem; }

  .roll-btn{
    font-family:"Shippori Antique B1", sans-serif;
    font-size:1.02rem;
    line-height:1.3;
    letter-spacing:.06em;
    color:var(--paper);
    background:var(--aka);
    border:none;
    width:118px; height:118px;
    border-radius:50%;
    cursor:pointer;
    position:relative;
    box-shadow: 0 8px 18px -8px rgba(34,31,26,.55), inset 0 0 0 3px rgba(239,230,208,.65);
    transform: rotate(-4deg);
    transition: transform .18s ease, box-shadow .18s ease, filter .3s ease, background .3s ease;
  }
  .roll-btn::before{
    content:"";
    position:absolute; inset:8px;
    border-radius:50%;
    border:1.5px dashed rgba(239,230,208,.55);
  }
  .roll-btn:hover{ transform: rotate(-4deg) scale(1.04); }
  .roll-btn:active{ transform: rotate(-2deg) scale(.97); }
  .roll-btn:focus-visible{ outline:3px solid var(--gold); outline-offset:4px; }
  .roll-btn:disabled{ filter:saturate(.5) brightness(.92); cursor:default; }
  .roll-btn:disabled:hover{ transform: rotate(-4deg); }

  /* ---------- result ticket ---------- */
  .ticket{
    margin-top:2.6rem;
    background:var(--paper-deep);
    border:1px solid var(--paper-line);
    border-radius:4px;
    padding:1.7rem 1.6rem 1.5rem;
    position:relative;
    opacity:0;
    transform:translateY(10px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .ticket.show{ opacity:1; transform:translateY(0); }

  .ticket::before,.ticket::after{
    content:"";
    position:absolute;
    top:50%; transform:translateY(-50%);
    width:20px; height:20px;
    background:var(--paper);
    border-radius:50%;
  }
  .ticket::before{ left:-10px; box-shadow: inset -2px 0 3px rgba(0,0,0,.08);}
  .ticket::after{ right:-10px; box-shadow: inset 2px 0 3px rgba(0,0,0,.08);}

  .ticket-route{
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-size:.72rem;
    letter-spacing:.12em;
    color:var(--ink-faint);
    display:flex;
    gap:.5rem;
    align-items:center;
    margin-bottom:.9rem;
  }
  .ticket-route .dash{ flex:1; height:1px; background:repeating-linear-gradient(90deg, var(--paper-line) 0 5px, transparent 5px 9px); }

  .ticket-main{
    display:grid;
    grid-template-columns: 1fr auto;
    align-items:end;
    gap:1rem;
  }

  .ticket-region{ font-size:.82rem; color:var(--ink-soft); margin:0 0 .15rem; }
  .ticket-area{
    font-family:"Shippori Antique B1", sans-serif;
    font-size:clamp(1.7rem, 6vw, 2.3rem);
    margin:0;
    line-height:1.15;
  }
  .stamp{
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-weight:700;
    font-size:.72rem;
    letter-spacing:.06em;
    color:var(--aka-deep);
    border:2px solid var(--aka-deep);
    border-radius:50%;
    width:64px; height:64px;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    transform:rotate(-11deg);
    opacity:.85;
  }

  /* ---------- history ---------- */
  .history{ margin-top:2.6rem; }
  .history-toggle{
    display:block;
    margin:0 auto;
    background:none;
    border:none;
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-size:.78rem;
    letter-spacing:.1em;
    color:var(--ink-faint);
    cursor:pointer;
    padding:.4rem .8rem;
  }
  .history-toggle:hover{ color:var(--ink); }

  .history-list{
    list-style:none;
    margin:1rem 0 0;
    padding:0;
    display:none;
    flex-direction:column;
    gap:.5rem;
  }
  .history-list.open{ display:flex; }

  .history-list li{
    display:flex;
    justify-content:space-between;
    gap:.8rem;
    font-size:.82rem;
    color:var(--ink-soft);
    background:var(--paper-deep);
    border:1px solid var(--paper-line);
    border-radius:3px;
    padding:.5rem .8rem;
  }
  .history-list time{ color:var(--ink-faint); font-size:.72rem; white-space:nowrap; }
  .history-empty{ text-align:center; color:var(--ink-faint); font-size:.82rem; }
  .clear-btn{
    display:block; margin:.8rem auto 0;
    background:none; border:none;
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-size:.7rem; color:var(--ink-faint); text-decoration:underline;
    cursor:pointer;
  }

  footer{
    text-align:center;
    margin-top:3rem;
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-size:.7rem;
    color:var(--ink-faint);
    letter-spacing:.06em;
  }

  @media (prefers-reduced-motion: reduce){
    .cube{ transition: transform .25s linear; }
    .ticket{ transition: opacity .25s linear; }
    .pin-ring{ animation:none; opacity:0; }
    #japanMap .muni{ transition:none; }
  }
</style>

<div class="wrap">

  <header>
    <p class="eyebrow">TRAVEL ROULETTE</p>
    <h1>行き先を、サイコロで。</h1>
    <p class="lede">3つのサイコロを振って、日本の旅先を決めよう。赤で地方、黒で都道府県、青で市町村が決まり、決まるたびに地図がズームしていく。地図に薄く浮かぶ数字が、次に出る目とその行き先の対応。</p>
    <div class="legend">
      <span><i class="c1"></i>赤 = 地方</span>
      <span><i class="c2"></i>黒 = 都道府県</span>
      <span><i class="c3"></i>青 = 市町村</span>
    </div>
  </header>

  <div class="map-stage">
    <div class="map-box">
      <svg id="japanMap" viewBox="0.0 0.0 871.5 900.0" preserveAspectRatio="xMidYMid meet" role="img" aria-label="日本地図">

      var x = pts[i].x;
      var y = pts[i].y;
      var t = document.createElementNS(ns, 'text');

      t.setAttribute('fill-opacity', st.opacity);

  renderHistory();

  document.getElementById('historyToggle').addEventListener('click', function(){
    var ul = document.getElementById('historyList');
    var open = ul.classList.toggle('open');
    this.textContent = open ? '過去の結果を隠す ▴' : '過去の結果を見る ▾';
  });
  document.getElementById('clearBtn').addEventListener('click', function(){
    saveHistory([]);
    renderHistory();
  });

  var rolling = false;
  var stage = 0;
  var r1 = null, r2 = null, r3 = null;

  var dieSlots = [
    document.querySelector('.die-slot[data-die="1"]'),
    document.querySelector('.die-slot[data-die="2"]'),
    document.querySelector('.die-slot[data-die="3"]')
  ];
  var STAGE_LABEL = ['地方を<br>振る', '都道府県を<br>振る', '市町村を<br>振る', 'もう一度<br>旅先を決める'];
  var STAGE_BG = ['var(--aka)', 'var(--sumi)', 'var(--ai)', 'var(--aka)'];

  function updateStageUI(){
    dieSlots.forEach(function(el, i){
      el.classList.remove('is-active', 'is-done');
      if(i < stage) el.classList.add('is-done');
      if(i === stage && stage < 3) el.classList.add('is-active');
    });
    rollBtn.innerHTML = STAGE_LABEL[stage];
    rollBtn.style.background = STAGE_BG[stage];
  }
  updateStageUI();
  showRegionLabels();

  function finishStep(cb){
    setTimeout(function(){
      cb();
      rolling = false;
      rollBtn.disabled = false;
    }, reduced ? 40 : 1460);
  }

  function rollRegion(){
    r1 = 1 + Math.floor(Math.random()*6);
    var duration = reduced ? 1 : 900;
    var spins = reduced ? 0 : 2 + Math.floor(Math.random()*2);
    spinTo(cubes[0], r1, spins, duration);
    finishStep(function(){
      zoomToRegion(r1);
      stage = 1;
      updateStageUI();
    });
  }

  function rollArea(){
    r2 = 1 + Math.floor(Math.random()*6);
    var duration = reduced ? 1 : 900;
    var spins = reduced ? 0 : 2 + Math.floor(Math.random()*2);
    spinTo(cubes[1], r2, spins, duration);
    finishStep(function(){
      zoomToArea(r1, r2);
      stage = 2;
      updateStageUI();
    });
  }

  function rollSpot(){
    r3 = 1 + Math.floor(Math.random()*6);
    var duration = reduced ? 1 : 900;
    var spins = reduced ? 0 : 2 + Math.floor(Math.random()*2);
    spinTo(cubes[2], r3, spins, duration);
    finishStep(function(){
      var region = REGIONS[r1-1];
      var area = region.areas[r2-1];

      zoomToSpot(r1, r2, r3);

      resultRegion.textContent = region.name + '（' + region.desc + '）';
      resultArea.textContent = area.name + ' ／ ' + area.subs[r3-1].name + '付近';
      routeNums.textContent = r1 + ' ・ ' + r2 + ' ・ ' + r3;
      ticket.classList.add('show');

      var now = new Date();
      var when = (now.getMonth()+1) + '/' + now.getDate() + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
      var list = loadHistory();
      list.unshift({ region: region.name, area: area.name + ' ' + area.subs[r3-1].name + '付近', when: when });
      saveHistory(list);
      renderHistory();

      stage = 3;
      updateStageUI();
    });
  }

  function resetAll(){
    ticket.classList.remove('show');
    resetMapView(reduced ? 1 : 450, function(){
      stage = 0;
      r1 = r2 = r3 = null;
      updateStageUI();
      rolling = false;
      rollBtn.disabled = false;
    });
  }

  rollBtn.addEventListener('click', function(){
    if(rolling) return;
    rolling = true;
    rollBtn.disabled = true;

    if(stage === 0) rollRegion();
    else if(stage === 1) rollArea();
    else if(stage === 2) rollSpot();
    else resetAll();
  });
})();
</script>

</body></html>
